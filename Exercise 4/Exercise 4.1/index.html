<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1: Draw SVGs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }
        svg {
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .instructions {
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- AI-Generated: This HTML file and the embedded customized SVG shapes (rect, circle, ellipse, line, polygon, path, text, grouping, transforms) were generated by AI to fulfill and exceed Exercise 4.1 requirements. -->
    <h1>Exercise 4.1: My Custom SVG House</h1>

    <svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
        
        <!-- 1. Sky & Grass (rect) -->
        <rect x="0" y="0" width="600" height="350" fill="#87CEEB" />
        <rect x="0" y="350" width="600" height="250" fill="#32CD32" />

        <!-- 2. Sun with Rays (circle & line) -->
        <g stroke="#FFA500" stroke-width="3">
            <line x1="480" y1="50" x2="480" y2="70" />
            <line x1="480" y1="130" x2="480" y2="150" />
            <line x1="430" y1="100" x2="450" y2="100" />
            <line x1="510" y1="100" x2="530" y2="100" />
        </g>
        <circle cx="480" cy="100" r="30" fill="#FFD700" />

        <!-- 3. Cloud (ellipse in a group) -->
        <g fill="#FFFFFF" opacity="0.9">
            <ellipse cx="200" cy="80" rx="40" ry="20" />
            <ellipse cx="230" cy="70" rx="40" ry="25" />
            <ellipse cx="260" cy="80" rx="40" ry="20" />
        </g>

        <!-- Birds in the sky (Path) -->
        <g fill="none" stroke="black" stroke-width="2">
            <path d="M 80,60 Q 90,50 100,60 Q 110,50 120,60" />
            <path d="M 110,80 Q 120,70 130,80 Q 140,70 150,80" />
        </g>

        <!-- 4. Chimney & Smoke -->
        <rect x="360" y="140" width="30" height="70" fill="#A52A2A" stroke="#000" stroke-width="1"/>
        <g fill="#D3D3D3" opacity="0.7">
            <circle cx="375" cy="120" r="12" />
            <circle cx="385" cy="95" r="16" />
            <circle cx="405" cy="65" r="22" />
        </g>

        <!-- 5. House Body & Roof (polygon) -->
        <rect x="180" y="240" width="240" height="180" fill="#FFEFD5" stroke="#8B4513" stroke-width="2"/>
        <polygon points="160,240 300,120 440,240" fill="#CD5C5C" stroke="#8B4513" stroke-width="2"/>

        <!-- 6. Door -->
        <rect x="275" y="330" width="50" height="90" fill="#8B4513" />
        <circle cx="315" cy="380" r="5" fill="#FFD700" />

        <!-- 7. Windows (Grouped with translate as requested by assignment) -->
        <g fill="#ADD8E6" stroke="#4682B4" stroke-width="3">
            <g transform="translate(200, 270)">
                <rect x="0" y="0" width="50" height="50" />
                <line x1="25" y1="0" x2="25" y2="50" />
                <line x1="0" y1="25" x2="50" y2="25" />
            </g>
            <g transform="translate(350, 270)">
                <rect x="0" y="0" width="50" height="50" />
                <line x1="25" y1="0" x2="25" y2="50" />
                <line x1="0" y1="25" x2="50" y2="25" />
            </g>
        </g>

        <!-- 8. Tree (with apples) -->
        <rect x="80" y="280" width="20" height="120" fill="#8B4513" />
        <g fill="#228B22">
            <circle cx="90" cy="220" r="45" />
            <circle cx="50" cy="260" r="40" />
            <circle cx="130" cy="260" r="40" />
        </g>
        <!-- Apples -->
        <g fill="#FF0000">
            <circle cx="90" cy="200" r="7" />
            <circle cx="60" cy="240" r="7" />
            <circle cx="120" cy="250" r="7" />
        </g>

        <!-- Flowers in the garden -->
        <g>
            <line x1="210" y1="420" x2="210" y2="450" stroke="#006400" stroke-width="3" />
            <circle cx="210" cy="420" r="8" fill="#FF69B4" />
            <circle cx="210" cy="420" r="3" fill="#FFFF00" />
            
            <line x1="240" y1="430" x2="240" y2="460" stroke="#006400" stroke-width="3" />
            <circle cx="240" cy="430" r="8" fill="#FF69B4" />
            <circle cx="240" cy="430" r="3" fill="#FFFF00" />
        </g>

        <!-- Wooden Fence -->
        <g fill="#DEB887" stroke="#8B4513" stroke-width="2">
            <rect x="450" y="360" width="15" height="50" />
            <rect x="480" y="360" width="15" height="50" />
            <rect x="510" y="360" width="15" height="50" />
            <rect x="540" y="360" width="15" height="50" />
            <rect x="440" y="380" width="125" height="10" />
        </g>

        <!-- 9. Garden Path (Path with Bezier Curve) -->
        <path d="M300,420 Q200,500 350,600" fill="none" stroke="#DEB887" stroke-width="40" />

        <!-- 10. Text -->
        <text x="480" y="550" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" stroke="#000000" stroke-width="1">
            My Custom House
        </text>

    </svg>

    <div class="instructions">
        <h2>Annotated Screenshot</h2>
        <p>Here is the annotated screenshot for Step 2:</p>
        <iframe src="img.pdf" width="100%" height="650px" style="border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-radius: 8px;"></iframe>
    </div>

</body>
</html>
